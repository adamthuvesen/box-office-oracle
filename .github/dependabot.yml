version: 2
updates:
  # Keep GitHub Actions pinned versions current and auditable. Combined with
  # SHA-pinning of third-party actions, this is the supply-chain hygiene path.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # Python dependencies (pyproject.toml / uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
