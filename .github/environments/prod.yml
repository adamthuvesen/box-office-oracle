environment: prod
# Solo personal project: review gates intentionally not enabled. Bug-hunt
# C13 flagged the lack of gates; the risk it mitigates (a contributor other
# than the owner triggering a prod deploy) does not apply here. The IAM
# blast-radius work in C9/C10 still constrains what a triggered deploy can
# do. Re-enable required_reviewers / prevent_self_review later if the repo
# gains additional contributors.
protection_rules:
  required_reviewers: 0
  wait_timer: 0
  prevent_self_review: false

secrets:
  # Snowflake uses key-pair auth; AWS uses OIDC role assumption. No static
  # AWS_ACCESS_KEY_ID or Snowflake password lives here by design.
  SNOWFLAKE_ACCOUNT: "{{ secrets.SNOWFLAKE_ACCOUNT }}"
  SNOWFLAKE_USER: "{{ secrets.SNOWFLAKE_USER }}"
  SNOWFLAKE_PRIVATE_KEY: "{{ secrets.SNOWFLAKE_PRIVATE_KEY }}"
  SNOWFLAKE_ROLE: "DBT_RUNNER"
  SNOWFLAKE_DATABASE: "BOX_OFFICE"
  SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
  SNOWFLAKE_SCHEMA_RAW: "RAW"
  SNOWFLAKE_SCHEMA_STAGING: "STAGING"
  SNOWFLAKE_SCHEMA_ML_TRAINING: "ML_TRAINING"
  SNOWFLAKE_SCHEMA_FEATURE_STORE: "FEATURE_STORE"

  # SageMaker Configuration
  SAGEMAKER_ROLE_ARN: "{{ secrets.SAGEMAKER_ROLE_ARN }}"

variables:
  # Pipeline Configuration
  ML_PIPELINE_TIMEOUT: "30"
  MAX_TRAINING_TIME: "1800"
  INSTANCE_TYPE: "ml.m5.large"
