# Hand-curated must-have movies for the local dataset.
#
# box-office-curated-movies fetches any entry missing from the budget parquet
# and appends it (raw JSONL + flat row), provided it clears the inclusion bar
# (>= $5M worldwide gross, >= 60min runtime). The TMDB /discover sweep has
# paging holes; this list guarantees the highest-grossing films 1980-2025 are
# always present.
#
# documented_budget (USD) is a fallback used only when TMDB reports a
# zero/blank production budget for the movie.
