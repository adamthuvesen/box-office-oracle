# Adaptations of a specific non-umbrella source with a documented
# pre-release success basis -> tier 3. `basis` must predate `from_year`.
source_works:
  - name: The Godfather
    from_year: 1980
    basis: "Mario Puzo's The Godfather (1969) was a #1 bestseller; 1972/1974 films were hits"
    patterns:
      title:
        - "\\bthe godfather\\b"
  - name: The Exorcist
    from_year: 1980
    basis: "Blatty's The Exorcist (1971) was a bestseller; the 1973 film a phenomenon"
    patterns:
      title:
        - "\\bexorcist\\b"
  - name: Jaws
    from_year: 1980
    basis: "Benchley's Jaws (1974) was a bestseller; the 1975 film broke box-office records"
    patterns:
      title:
        - "\\bjaws\\b"
  - name: The Shining
    from_year: 1980
    basis: "Stephen King's The Shining (1977) was a bestseller"
    patterns:
      title:
        - "\\bthe shining\\b"
  - name: Dune
    from_year: 1980
    basis: "Frank Herbert's Dune (1965) was the best-selling science fiction novel of its era"
    patterns:
      title:
        - "\\bdune\\b"
  - name: Bridget Jones
    from_year: 1999
    basis: "Fielding's Bridget Jones's Diary (1996) was a bestselling novel"
    patterns:
      title:
        - "\\bbridget jones\\b"
  - name: The Da Vinci Code
    from_year: 2004
    basis: "Dan Brown's The Da Vinci Code (2003) was a record-breaking bestseller"
    patterns:
      title:
        - "\\bthe da vinci code\\b"
        - "\\bangels & demons\\b"
        - "^inferno$"
  - name: Twilight
    from_year: 2007
    basis: "Meyer's Twilight novels (2005-) were young-adult bestsellers before any film"
    patterns:
      title:
        - "\\btwilight saga\\b"
        - "^twilight$"
      collection:
        - "\\btwilight\\b"
  - name: The Hunger Games
    from_year: 2009
    basis: "Collins's The Hunger Games (2008) was a young-adult bestseller"
    patterns:
      title:
        - "\\bhunger games\\b"
      collection:
        - "\\bhunger games\\b"
  - name: Fifty Shades
    from_year: 2012
    basis: "James's Fifty Shades of Grey (2011) was a record-selling novel"
    patterns:
      title:
        - "\\bfifty shades\\b"
      collection:
        - "\\bfifty shades\\b"
  - name: Ready Player One
    from_year: 2012
    basis: "Cline's Ready Player One (2011) was a bestselling novel"
    patterns:
      title:
        - "\\bready player one\\b"
  - name: The Martian
    from_year: 2014
    basis: "Weir's The Martian became a bestseller with the 2014 Crown edition"
    patterns:
      title:
        - "^the martian$"
  - name: American Sniper
    from_year: 2013
    basis: "Kyle's American Sniper (2012) was a #1 bestselling memoir"
    patterns:
      title:
        - "\\bamerican sniper\\b"
  - name: The Fault in Our Stars
    from_year: 2013
    basis: "Green's The Fault in Our Stars (2012) was a #1 young-adult bestseller"
    patterns:
      title:
        - "\\bthe fault in our stars\\b"
  - name: Gone Girl
    from_year: 2013
    basis: "Flynn's Gone Girl (2012) was a #1 bestseller"
    patterns:
      title:
        - "^gone girl$"
  - name: Crazy Rich Asians
    from_year: 2014
    basis: "Kwan's Crazy Rich Asians (2013) was a bestselling novel"
    patterns:
      title:
        - "\\bcrazy rich asians\\b"

# Provenance only (ip_source_type); adaptations default to tier 4 unless a
# brand rule, prior-franchise gross, or source_works rule raises them.
source_mappings:
  - source_type: comic
    patterns:
      keyword:
        - "\\bbased on comic\\b"
        - "\\bbased on graphic novel\\b"
  - source_type: book
    patterns:
      keyword:
        - "\\bbased on novel or book\\b"
        - "\\bbased on young adult novel\\b"
  - source_type: video_game
    patterns:
      keyword:
        - "\\bbased on video game\\b"
        - "\\bbased on game\\b"
  - source_type: toy
    patterns:
      keyword:
        - "\\bbased on toy\\b"
  - source_type: tv
    patterns:
      keyword:
        - "\\bbased on tv series\\b"
        - "\\bbased on television\\b"
  - source_type: play_or_musical
    patterns:
      keyword:
        - "\\bbased on play or musical\\b"
        - "\\bbased on musical\\b"
  - source_type: remake
    sequel_or_spinoff: true
    patterns:
      keyword:
        - "\\bremake\\b"
        - "\\breboot\\b"
  - source_type: sequel_or_spinoff
    sequel_or_spinoff: true
    patterns:
      keyword:
        - "\\bsequel\\b"
        - "\\bprequel\\b"
        - "\\bspin[- ]?off\\b"

awareness_sources:
  - name: true_story
    patterns:
      keyword:
        - "\\bbased on true story\\b"
        - "\\btrue story\\b"
  - name: biography
    patterns:
      keyword:
        - "\\bbiography\\b"
        - "\\bbiopic\\b"
  - name: historical_event
    patterns:
      keyword:
        - "\\bhistorical event\\b"
