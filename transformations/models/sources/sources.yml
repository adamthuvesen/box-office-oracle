version: 2

sources:
  - name: RAW
    description: "Raw box office data from various sources"
    database: BOX_OFFICE
    schema: RAW
    tables:
      - name: BOX_OFFICE_V3
        description: >
          Raw movie dataset with box office performance, budgets, and metadata.
          Duplicate tmdb_id values can occur in this table; stg_box_office
          deduplicates to one row per TMDB_ID by latest release_date, then
          lowest tmdb_id as a deterministic tiebreak. No source freshness: RAW
          has no reliable loaded_at; staging sets loaded_at at transform time.
        columns:
          - name: tmdb_id
            description: "The Movie Database (TMDb) unique identifier"
            data_type: number
          - name: imdb_id
            description: "Internet Movie Database (IMDb) unique identifier"
            data_type: string
          - name: title
            description: "Movie title"
            data_type: string
          - name: release_date
            description: "Release date of the movie"
            data_type: date
          - name: original_language
            description: "Original language of the movie"
            data_type: string
          - name: production_countries
            description: "Countries where the movie was produced"
            data_type: string
          - name: genres
            description: "Movie genre(s)"
            data_type: string
          - name: production_budget
            description: "Production budget"
            data_type: number
          - name: director
            description: "Movie director(s)"
            data_type: string
          - name: actors
            description: "Main actors"
            data_type: string
          - name: mpaa
            description: "MPAA rating (G, PG, PG-13, R, etc.)"
            data_type: string
          - name: release_type
            description: "Type of release (wide, limited)"
            data_type: string
          - name: runtime
            description: "Movie runtime in minutes"
            data_type: number
          - name: overview
            description: "Movie plot overview/synopsis"
            data_type: string
          - name: tagline
            description: "Movie tagline"
            data_type: string
          - name: keywords
            description: "Movie keywords/tags"
            data_type: string
          - name: production_company
            description: "Production company"
            data_type: string
          - name: release_year
            description: "Year the movie was released"
            data_type: number
          - name: worldwide_gross
            description: "Worldwide box office gross revenue"
            data_type: number
