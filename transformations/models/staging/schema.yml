version: 2

models:
  - name: stg_box_office
    description: "Staging model for pre-release movie features plus the training target"
    columns:
      - name: tmdb_id
        description: "TMDb identifier; one row per id after source deduplication"
        data_type: integer
        tests:
          - not_null
          - unique
      - name: title
        description: "Movie title"
        data_type: string
        tests:
          - not_null
      - name: worldwide_gross
        description: "Worldwide box office gross revenue; training target only"
        data_type: float
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: release_year
        description: "Year the movie was released"
        data_type: integer
        tests:
          - dbt_utils.accepted_range:
              min_value: 1900
              max_value: 2030
      - name: original_language
        description: "Original language of the movie"
        data_type: string
        tests:
          - not_null
      - name: production_countries
        description: "Countries where the movie was produced"
        data_type: string
      - name: genres
        description: "Movie genre(s)"
        data_type: string
        tests:
          - not_null
      - name: production_budget
        description: "Production budget"
        data_type: float
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: director
        description: "Movie director(s)"
        data_type: string
        tests:
          - not_null
      - name: production_company
        description: "Production company"
        data_type: string
        tests:
          - not_null
      - name: actors
        description: "Main actors in the movie"
        data_type: string
      - name: mpaa
        description: "MPAA rating (G, PG, PG-13, R, etc.)"
        data_type: string
      - name: runtime
        description: "Movie runtime in minutes"
        data_type: integer
        tests:
          - not_null:
              config:
                severity: warn
      - name: release_date
        description: "Release date of the movie"
        data_type: date
        tests:
          - not_null:
              config:
                severity: warn
      - name: imdb_id
        description: "Internet Movie Database (IMDb) unique identifier"
        data_type: string
      - name: overview
        description: "Movie plot overview/synopsis"
        data_type: string
      - name: tagline
        description: "Movie tagline"
        data_type: string
      - name: keywords
        description: "Movie keywords/tags"
        data_type: string
      - name: release_type
        description: "Type of release (wide, limited; source occasionally emits NULL/other values)"
        data_type: string
        tests:
          - accepted_values:
              values: ['wide', 'limited']
              config:
                severity: warn
                store_failures: true
      - name: loaded_at
        description: "Timestamp when the record was loaded into the staging table"
        data_type: timestamp
        tests:
          - not_null
